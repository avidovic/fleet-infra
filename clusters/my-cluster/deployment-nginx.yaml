apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    source-file: deployment-nginx.yaml
  name: nginx
  namespace: nginx
spec:
  chart:
    spec:
      chart: nginx
      sourceRef:
        kind: HelmRepository
        name: source-nginx.yaml
        namespace: nginx
      version: 15.x
  interval: 5m0s
  targetNamespace: nginx
  values:
    replicaCount: 2
    service:
      type: ClusterIP
